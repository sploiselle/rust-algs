[package]
name = "bench-plan"
version = "0.1.0"
description = "Every benchmark group, the joins' memory profiles and the claims they hold"
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
algs = { path = "../algs" }
bench = { path = "../bench" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
foldhash = "0.2"

[[bench]]
name = "memory"
harness = false
