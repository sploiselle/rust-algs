[package]
name = "bench"
version = "0.1.0"
description = "Benchmarks and memory profiles of the algs reference implementations"
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[[bin]]
name = "bench"
path = "src/main.rs"
bench = false

[dependencies]
algs = { path = "../algs" }
foldhash = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# No plotters: the report reads criterion's JSON.
criterion = { version = "0.8.2", default-features = false, features = ["rayon", "cargo_bench_support"] }

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "joins"
harness = false

[[bench]]
name = "memory"
harness = false
