[package]
name = "bench"
version = "0.1.0"
description = "Timings of the algs join implementations, one binary a group"
edition.workspace = true
publish.workspace = true
# One target a group, each declared below: `benches/support/` isn't one.
autobenches = false

[lib]
bench = false

[dependencies]
algs = { path = "../algs" }
foldhash = "0.2"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
# No plotters: the report reads criterion's JSON.
criterion = { version = "0.8.2", default-features = false, features = ["rayon", "cargo_bench_support"] }

[[bench]]
name = "one_to_one"
harness = false

[[bench]]
name = "small_side"
harness = false

[[bench]]
name = "both_small"
harness = false

[[bench]]
name = "hash_variants"
harness = false

[[bench]]
name = "multiway_dense"
harness = false

[[bench]]
name = "multiway_sparse"
harness = false

[[bench]]
name = "multiway_selective"
harness = false
