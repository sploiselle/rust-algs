[package]
name = "bench"
version = "0.1.0"
description = "Runs the benchmarks that are out of date, and writes the tables a post quotes: no bench target links it"
edition.workspace = true
publish.workspace = true
autobenches = false

[lib]
bench = false

[[bin]]
name = "bench"
path = "src/main.rs"
bench = false

[dependencies]
bench-joins = { path = "../joins" }
bench-joins-plan = { path = "../joins-plan" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# A run records the hash of the binary it ran, and of the source it was built from.
sha2 = "0.10"
