[package]
name = "bench-cache"
version = "0.1.0"
description = "Why the hash join's cost per row climbs: its loops, its reads and what they cost"
edition.workspace = true
publish.workspace = true

[lib]
bench = false

[dependencies]
algs = { path = "../algs" }
bench = { path = "../bench" }
foldhash = "0.2"
# HashTable takes a hash the caller computed, for the batched join.
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
# proc_pid_rusage, for the instructions a join retires.
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "phases"
harness = false

[[bench]]
name = "reads"
harness = false

[[bench]]
name = "hashers"
harness = false

[[bench]]
name = "absent"
harness = false

[[bench]]
name = "inlining"
harness = false
