[package]
name = "algs"
version = "0.1.0"
description = "Random algorithms in Rust"
license = "MIT"
edition.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3"
thiserror = "2"

# Only used by the binaries in src/bin; the library returns typed errors.
anyhow = "1.0"
