<p class="ds-beat" data-in="5" data-out="6" data-cont="" data-event="b-2"><span class="ds-beat-body"><span class="ds-lead">sync</span> on B syncs from A: it already holds <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="A" data-dot="A:1" data-actor-n="1">A</span><span class="ds-dot-id ds-count" data-actor="A" data-dot="A:1" data-actor-n="1">:1</span></code>, so it takes that to be the write it has and keeps "x"</span></p>
<p class="ds-beat" data-in="6" data-out="7" data-cont="" data-event="a-4"><span class="ds-beat-body"><span class="ds-lead">sync</span> on A syncs from B, which holds <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="A" data-dot="A:1" data-actor-n="1">A</span><span class="ds-dot-id ds-count" data-actor="A" data-dot="A:1" data-actor-n="1">:1</span></code> too: A believes it already has that write, and keeps "y"</span></p>
<p class="ds-beat" data-in="7" data-cont="" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-beat-body">B keeps "x" and A keeps "y": each believes it already holds the other's write, so they never converge</span></p>
