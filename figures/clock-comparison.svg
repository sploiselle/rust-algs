<svg xmlns="http://www.w3.org/2000/svg" class="ds-figure" role="img" viewBox="0 0 684 403" width="684" height="403">
  <title>Three clocks, one trace: Lamport, hybrid logical, and vector</title>
  <style>
    .ds-figure { max-width: 100%; height: auto; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .ds-figure .ds-lane { stroke: currentColor; stroke-width: 1; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .ds-lane-arrow { fill: currentColor; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .ds-lane-name { fill: currentColor; font-weight: 600; }
    .ds-figure .ds-event { fill: var(--ds-event, currentColor); }
    .ds-figure .ds-name, .ds-figure .ds-label, .ds-figure .ds-callout { fill: currentColor; }
    .ds-figure .ds-label { font-size: 11px; }
    .ds-figure .ds-annotation { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: var(--ds-annotation, currentColor); }
    .ds-figure .ds-message { stroke: var(--ds-message, currentColor); stroke-width: 1.5; fill: none; }
    .ds-figure .ds-arrow { fill: var(--ds-message, currentColor); }
    .ds-figure .ds-callout-ring { fill: none; stroke: var(--ds-accent, currentColor); stroke-width: 1.5; stroke-dasharray: 2 2; }
    .ds-figure .ds-callout-mark { fill: var(--ds-accent, currentColor); font-size: 10px; font-weight: 700; }
    .ds-figure .ds-dot { fill: currentColor; }
    .ds-figure .ds-dot.ds-gap { fill: none; stroke: currentColor; stroke-dasharray: 3 2; }
    .ds-figure .ds-claim { fill: currentColor; }
    .ds-figure .ds-wrong { fill: var(--ds-wrong, currentColor); font-weight: 700; }
  </style>
  <line class="ds-lane" x1="28" y1="33" x2="676" y2="33"/>
  <polygon class="ds-lane-arrow" points="676,29 684,33 676,37"/>
  <text class="ds-lane-name" x="18" y="37" text-anchor="end">A</text>
  <line class="ds-lane" x1="28" y1="136" x2="676" y2="136"/>
  <polygon class="ds-lane-arrow" points="676,132 684,136 676,140"/>
  <text class="ds-lane-name" x="18" y="140" text-anchor="end">B</text>
  <line class="ds-lane" x1="28" y1="239" x2="676" y2="239"/>
  <polygon class="ds-lane-arrow" points="676,235 684,239 676,243"/>
  <text class="ds-lane-name" x="18" y="243" text-anchor="end">C</text>
  <circle class="ds-event" cx="73" cy="33" r="5"/>
  <circle class="ds-event" cx="180" cy="33" r="5"/>
  <circle class="ds-event" cx="252" cy="136" r="5"/>
  <circle class="ds-event" cx="344.5" cy="136" r="5"/>
  <circle class="ds-event" cx="416.5" cy="239" r="5"/>
  <circle class="ds-event" cx="495" cy="136" r="5"/>
  <circle class="ds-event" cx="567" cy="239" r="5"/>
  <circle class="ds-event" cx="639" cy="33" r="5"/>
  <text class="ds-name" x="73" y="17.8" text-anchor="middle">A1</text>
  <text class="ds-name" x="180" y="17.8" text-anchor="middle">A2</text>
  <text class="ds-name" x="252" y="120.8" text-anchor="middle">B1</text>
  <text class="ds-name" x="340.5" y="120.8" text-anchor="start">B2</text>
  <text class="ds-name" x="416.5" y="223.8" text-anchor="middle">C1</text>
  <text class="ds-name" x="495" y="120.8" text-anchor="middle">B3</text>
  <text class="ds-name" x="563" y="223.8" text-anchor="start">C2</text>
  <text class="ds-name" x="639" y="17.8" text-anchor="middle">A3</text>
  <text class="ds-annotation" x="73" y="53.2" text-anchor="middle">clock 10<tspan x="73" dy="13">Lamport 1</tspan><tspan x="73" dy="13">HLC 10,0</tspan><tspan x="73" dy="13">VC {A:1}</tspan></text>
  <text class="ds-annotation" x="184" y="53.2" text-anchor="end">clock 20<tspan x="184" dy="13">Lamport 2</tspan><tspan x="184" dy="13">HLC 20,0</tspan><tspan x="184" dy="13">VC {A:2}</tspan></text>
  <text class="ds-annotation" x="252" y="156.2" text-anchor="middle">clock 5<tspan x="252" dy="13">Lamport 1</tspan><tspan x="252" dy="13">HLC 5,0</tspan><tspan x="252" dy="13">VC {B:1}</tspan></text>
  <text class="ds-annotation" x="344.5" y="156.2" text-anchor="middle">clock 15<tspan x="344.5" dy="13">Lamport 3</tspan><tspan x="344.5" dy="13">HLC 20,1</tspan><tspan x="344.5" dy="13">VC {A:2, B:2}</tspan></text>
  <text class="ds-annotation" x="416.5" y="259.2" text-anchor="middle">clock 50<tspan x="416.5" dy="13">Lamport 1</tspan><tspan x="416.5" dy="13">HLC 50,0</tspan><tspan x="416.5" dy="13">VC {C:1}</tspan></text>
  <text class="ds-annotation" x="499" y="156.2" text-anchor="end">clock 35<tspan x="499" dy="13">Lamport 4</tspan><tspan x="499" dy="13">HLC 35,0</tspan><tspan x="499" dy="13">VC {A:2, B:3}</tspan></text>
  <text class="ds-annotation" x="567" y="259.2" text-anchor="middle">clock 70<tspan x="567" dy="13">Lamport 5</tspan><tspan x="567" dy="13">HLC 70,0</tspan><tspan x="567" dy="13">VC {A:2, B:3, C:2}</tspan></text>
  <text class="ds-annotation" x="639" y="53.2" text-anchor="middle">clock 80<tspan x="639" dy="13">Lamport 3</tspan><tspan x="639" dy="13">HLC 80,0</tspan><tspan x="639" dy="13">VC {A:3}</tspan></text>
  <line class="ds-message" x1="185.9" y1="36.7" x2="330.1" y2="127"/>
  <polygon class="ds-arrow" points="337.7,131.8 328.2,129.9 331.9,124"/>
  <line class="ds-message" x1="499" y1="141.7" x2="557.3" y2="225.1"/>
  <polygon class="ds-arrow" points="562.4,232.4 554.4,227.1 560.1,223.1"/>
  <text class="ds-label" x="267.6" y="76" text-anchor="start">m1</text>
  <text class="ds-label" x="539.2" y="181.8" text-anchor="start">m2</text>
  <circle class="ds-callout-ring" cx="180" cy="33" r="9"/>
  <circle class="ds-callout-ring" cx="344.5" cy="136" r="9"/>
  <circle class="ds-callout-ring" cx="495" cy="136" r="9"/>
  <circle class="ds-callout-ring" cx="639" cy="33" r="9"/>
  <text class="ds-callout-mark" x="168" y="37" text-anchor="end">1</text>
  <text class="ds-callout-mark" x="356.5" y="140" text-anchor="start">1</text>
  <text class="ds-callout-mark" x="507" y="140" text-anchor="start">2</text>
  <text class="ds-callout-mark" x="651" y="37" text-anchor="start">2</text>
  <text class="ds-callout" x="28" y="332" text-anchor="start">1. B's clock runs 25 behind: m1 left A at 20,0 but arrives when B reads 15, so B2 keeps</text>
  <text class="ds-callout" x="44" y="350" text-anchor="start">A's wall time and counts on: 20,1</text>
  <text class="ds-callout" x="28" y="368" text-anchor="start">2. A3 ∥ B3, yet Lamport puts A3 first (3 &lt; 4) and the HLC puts B3 first (35,0 &lt; 80,0);</text>
  <text class="ds-callout" x="44" y="386" text-anchor="start">only {A:3} and {A:2, B:3} show neither happened first</text>
</svg>
