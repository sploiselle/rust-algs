<svg xmlns="http://www.w3.org/2000/svg" class="ds-figure" role="img" viewBox="0 0 511 289" width="511" height="289">
  <title>Reusing an actor id after state loss: two writes share one name</title>
  <style>
    .ds-figure { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .ds-figure .lane { stroke: currentColor; stroke-width: 1; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .lane-arrow { fill: currentColor; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .lane-name { fill: currentColor; font-weight: 600; }
    .ds-figure .event { fill: var(--ds-event, currentColor); }
    .ds-figure .name, .ds-figure .label, .ds-figure .callout { fill: currentColor; }
    .ds-figure .label { font-size: 11px; }
    .ds-figure .annotation { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: var(--ds-annotation, currentColor); }
    .ds-figure .message { stroke: var(--ds-message, currentColor); stroke-width: 1.5; fill: none; }
    .ds-figure .arrow { fill: var(--ds-message, currentColor); }
    .ds-figure .callout-ring { fill: none; stroke: var(--ds-accent, currentColor); stroke-width: 1.5; stroke-dasharray: 2 2; }
    .ds-figure .callout-mark { fill: var(--ds-accent, currentColor); font-size: 10px; font-weight: 700; }
    .ds-figure .dot { fill: currentColor; }
    .ds-figure .dot.gap { fill: none; stroke: currentColor; stroke-dasharray: 3 2; }
    .ds-figure .claim { fill: currentColor; }
    .ds-figure .wrong { fill: var(--ds-wrong, currentColor); font-weight: 700; }
  </style>
  <line class="lane" x1="29" y1="44" x2="503" y2="44"/>
  <polygon class="lane-arrow" points="503,40 511,44 503,48"/>
  <text class="lane-name" x="19" y="48" text-anchor="end">A</text>
  <line class="lane" x1="29" y1="129" x2="503" y2="129"/>
  <polygon class="lane-arrow" points="503,125 511,129 503,133"/>
  <text class="lane-name" x="19" y="133" text-anchor="end">B</text>
  <circle class="event" cx="88" cy="44" r="5"/>
  <text class="name" x="88" y="30" text-anchor="middle">write</text>
  <text class="annotation" x="92" y="66" text-anchor="end">A:1→"x"</text>
  <circle class="event" cx="160" cy="129" r="5"/>
  <text class="name" x="156" y="115" text-anchor="start">sync</text>
  <text class="annotation" x="160" y="151" text-anchor="middle">A:1→"x"</text>
  <circle class="event" cx="232" cy="44" r="5"/>
  <text class="name" x="232" y="30" text-anchor="middle">state lost</text>
  <text class="annotation" x="232" y="66" text-anchor="middle">∅</text>
  <circle class="event" cx="308" cy="44" r="5"/>
  <text class="name" x="308" y="30" text-anchor="middle">write</text>
  <text class="annotation" x="312" y="66" text-anchor="end">A:1→"y"</text>
  <circle class="event" cx="380" cy="129" r="5"/>
  <text class="name" x="380" y="102" text-anchor="middle">sync</text>
  <text class="annotation" x="380" y="151" text-anchor="middle">A:1→"x"</text>
  <circle class="event" cx="452" cy="44" r="5"/>
  <text class="name" x="452" y="30" text-anchor="middle">sync</text>
  <text class="annotation" x="448" y="66" text-anchor="start">A:1→"y"</text>
  <line class="message" x1="92.5" y1="49.3" x2="149.0" y2="116.0"/>
  <polygon class="arrow" points="154.8,122.9 146.3,118.3 151.7,113.8"/>
  <line class="message" x1="312.5" y1="49.3" x2="369.0" y2="116.0"/>
  <polygon class="arrow" points="374.8,122.9 366.3,118.3 371.7,113.8"/>
  <line class="message" x1="384.5" y1="123.7" x2="441.0" y2="57.0"/>
  <polygon class="arrow" points="446.8,50.1 443.7,59.2 438.3,54.7"/>
  <circle class="callout-ring" cx="88" cy="44" r="9"/>
  <text class="callout-mark" x="100" y="48">1</text>
  <circle class="callout-ring" cx="308" cy="44" r="9"/>
  <text class="callout-mark" x="320" y="48">1</text>
  <text class="callout" x="29" y="200">1. both writes are dot A:1: the reborn replica</text>
  <text class="callout" x="45" y="218">reissued a name it had already used</text>
  <circle class="callout-ring" cx="380" cy="129" r="9"/>
  <text class="callout-mark" x="392" y="133">2</text>
  <circle class="callout-ring" cx="452" cy="44" r="9"/>
  <text class="callout-mark" x="464" y="48">2</text>
  <text class="callout" x="29" y="236">2. B keeps "x" and A keeps "y": each believes it</text>
  <text class="callout" x="45" y="254">already holds the other's write, so they never</text>
  <text class="callout" x="45" y="272">converge</text>
</svg>
