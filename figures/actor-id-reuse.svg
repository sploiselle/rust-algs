<svg xmlns="http://www.w3.org/2000/svg" class="ds-figure" role="img" viewBox="0 0 506 256" width="506" height="256">
  <title>Reusing an actor id after state loss: two writes share one name</title>
  <style>
    .ds-figure { max-width: 100%; height: auto; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .ds-figure .ds-lane { stroke: currentColor; stroke-width: 1; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .ds-lane-arrow { fill: currentColor; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .ds-lane-name { fill: currentColor; font-weight: 600; }
    .ds-figure .ds-event { fill: var(--ds-event, currentColor); }
    .ds-figure .ds-name, .ds-figure .ds-label, .ds-figure .ds-callout { fill: currentColor; }
    .ds-figure .ds-label { font-size: 11px; }
    .ds-figure .ds-annotation { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: var(--ds-annotation, currentColor); }
    .ds-figure .ds-message { stroke: var(--ds-message, currentColor); stroke-width: 1.5; fill: none; }
    .ds-figure .ds-arrow { fill: var(--ds-message, currentColor); }
    .ds-figure .ds-callout-ring { fill: none; stroke: var(--ds-accent, currentColor); stroke-width: 1.5; stroke-dasharray: 2 2; }
    .ds-figure .ds-callout-mark { fill: var(--ds-accent, currentColor); font-size: 10px; font-weight: 700; }
    .ds-figure .ds-dot { fill: currentColor; }
    .ds-figure .ds-dot.ds-gap { fill: none; stroke: currentColor; stroke-dasharray: 3 2; }
    .ds-figure .ds-claim { fill: currentColor; }
    .ds-figure .ds-wrong { fill: var(--ds-wrong, currentColor); font-weight: 700; }
  </style>
  <line class="ds-lane" x1="28" y1="33" x2="498" y2="33"/>
  <polygon class="ds-lane-arrow" points="498,29 506,33 498,37"/>
  <text class="ds-lane-name" x="18" y="37" text-anchor="end">A</text>
  <line class="ds-lane" x1="28" y1="114" x2="498" y2="114"/>
  <polygon class="ds-lane-arrow" points="498,110 506,114 498,118"/>
  <text class="ds-lane-name" x="18" y="118" text-anchor="end">B</text>
  <circle class="ds-event" cx="87" cy="33" r="5"/>
  <circle class="ds-event" cx="159" cy="114" r="5"/>
  <circle class="ds-event" cx="231" cy="33" r="5"/>
  <circle class="ds-event" cx="303" cy="33" r="5"/>
  <circle class="ds-event" cx="375" cy="114" r="5"/>
  <circle class="ds-event" cx="447" cy="33" r="5"/>
  <text class="ds-name" x="87" y="17.8" text-anchor="middle">write</text>
  <text class="ds-name" x="155" y="98.8" text-anchor="start">sync</text>
  <text class="ds-name" x="231" y="17.8" text-anchor="middle">state lost</text>
  <text class="ds-name" x="303" y="17.8" text-anchor="middle">write</text>
  <text class="ds-name" x="375" y="135.8" text-anchor="middle">sync</text>
  <text class="ds-name" x="447" y="17.8" text-anchor="middle">sync</text>
  <text class="ds-annotation" x="91" y="53.2" text-anchor="end">A:1→"x"</text>
  <text class="ds-annotation" x="159" y="134.2" text-anchor="middle">A:1→"x"</text>
  <text class="ds-annotation" x="231" y="53.2" text-anchor="middle">∅</text>
  <text class="ds-annotation" x="307" y="53.2" text-anchor="end">A:1→"y"</text>
  <text class="ds-annotation" x="375" y="151.2" text-anchor="middle">A:1→"x"</text>
  <text class="ds-annotation" x="443" y="53.2" text-anchor="start">A:1→"y"</text>
  <line class="ds-message" x1="91.7" y1="38.2" x2="147.7" y2="101.3"/>
  <polygon class="ds-arrow" points="153.7,108 145.1,103.6 150.3,99"/>
  <line class="ds-message" x1="307.7" y1="38.2" x2="363.7" y2="101.3"/>
  <polygon class="ds-arrow" points="369.7,108 361.1,103.6 366.3,99"/>
  <line class="ds-message" x1="379.7" y1="108.8" x2="435.7" y2="45.7"/>
  <polygon class="ds-arrow" points="441.7,39 438.3,48 433.1,43.4"/>
  <circle class="ds-callout-ring" cx="87" cy="33" r="9"/>
  <circle class="ds-callout-ring" cx="303" cy="33" r="9"/>
  <circle class="ds-callout-ring" cx="375" cy="114" r="9"/>
  <circle class="ds-callout-ring" cx="447" cy="33" r="9"/>
  <text class="ds-callout-mark" x="99" y="37" text-anchor="start">1</text>
  <text class="ds-callout-mark" x="315" y="37" text-anchor="start">1</text>
  <text class="ds-callout-mark" x="387" y="118" text-anchor="start">2</text>
  <text class="ds-callout-mark" x="459" y="37" text-anchor="start">2</text>
  <text class="ds-callout" x="28" y="185" text-anchor="start">1. both writes are dot A:1: the reborn replica reissued a name</text>
  <text class="ds-callout" x="44" y="203" text-anchor="start">it had already used</text>
  <text class="ds-callout" x="28" y="221" text-anchor="start">2. B keeps "x" and A keeps "y": each believes it already holds</text>
  <text class="ds-callout" x="44" y="239" text-anchor="start">the other's write, so they never converge</text>
</svg>
