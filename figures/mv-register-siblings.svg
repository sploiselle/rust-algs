<svg xmlns="http://www.w3.org/2000/svg" class="ds-figure" role="img" viewBox="0 0 851 264" width="851" height="264">
  <title>Multi-value register: concurrent writes become siblings</title>
  <style>
    .ds-figure { max-width: 100%; height: auto; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .ds-figure .ds-lane { stroke: currentColor; stroke-width: 1; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .ds-lane-arrow { fill: currentColor; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .ds-lane-name { fill: currentColor; font-weight: 600; }
    .ds-figure .ds-event { fill: var(--ds-event, currentColor); }
    .ds-figure .ds-name, .ds-figure .ds-label, .ds-figure .ds-callout { fill: currentColor; }
    .ds-figure .ds-label { font-size: 11px; }
    .ds-figure .ds-annotation { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: var(--ds-annotation, currentColor); }
    .ds-figure .ds-message { stroke: var(--ds-message, currentColor); stroke-width: 1.5; fill: none; }
    .ds-figure .ds-arrow { fill: var(--ds-message, currentColor); }
    .ds-figure .ds-callout-ring { fill: none; stroke: var(--ds-accent, currentColor); stroke-width: 1.5; stroke-dasharray: 2 2; }
    .ds-figure .ds-callout-mark { fill: var(--ds-accent, currentColor); font-size: 10px; font-weight: 700; }
    .ds-figure .ds-dot { fill: currentColor; }
    .ds-figure .ds-dot.ds-gap { fill: none; stroke: currentColor; stroke-dasharray: 3 2; }
    .ds-figure .ds-claim { fill: currentColor; }
    .ds-figure .ds-wrong { fill: var(--ds-wrong, currentColor); font-weight: 700; }
  </style>
  <line class="ds-lane" x1="35" y1="33" x2="843" y2="33"/>
  <polygon class="ds-lane-arrow" points="843,29 851,33 843,37"/>
  <text class="ds-lane-name" x="25" y="37" text-anchor="end">r1</text>
  <line class="ds-lane" x1="35" y1="127" x2="843" y2="127"/>
  <polygon class="ds-lane-arrow" points="843,123 851,127 843,131"/>
  <text class="ds-lane-name" x="25" y="131" text-anchor="end">r2</text>
  <circle class="ds-event" cx="123" cy="33" r="5"/>
  <circle class="ds-event" cx="195" cy="127" r="5"/>
  <circle class="ds-event" cx="267" cy="33" r="5"/>
  <circle class="ds-event" cx="339" cy="127" r="5"/>
  <circle class="ds-event" cx="439" cy="127" r="5"/>
  <circle class="ds-event" cx="511" cy="33" r="5"/>
  <circle class="ds-event" cx="583" cy="127" r="5"/>
  <circle class="ds-event" cx="655" cy="33" r="5"/>
  <circle class="ds-event" cx="795" cy="33" r="5"/>
  <text class="ds-name" x="123" y="17.8" text-anchor="middle">write</text>
  <text class="ds-name" x="191" y="111.8" text-anchor="start">sync</text>
  <text class="ds-name" x="267" y="17.8" text-anchor="middle">write</text>
  <text class="ds-name" x="339" y="111.8" text-anchor="middle">write</text>
  <text class="ds-name" x="439" y="148.8" text-anchor="middle">sync</text>
  <text class="ds-name" x="511" y="17.8" text-anchor="middle">sync</text>
  <text class="ds-name" x="587" y="111.8" text-anchor="end">write</text>
  <text class="ds-name" x="655" y="17.8" text-anchor="middle">sync</text>
  <text class="ds-name" x="795" y="17.8" text-anchor="middle">sync (stale)</text>
  <text class="ds-annotation" x="127" y="53.2" text-anchor="end">A:1→"draft"</text>
  <text class="ds-annotation" x="195" y="147.2" text-anchor="middle">A:1→"draft"</text>
  <text class="ds-annotation" x="271" y="53.2" text-anchor="end">A:2→"edit A"</text>
  <text class="ds-annotation" x="339" y="147.2" text-anchor="middle">B:1→"edit B"</text>
  <text class="ds-annotation" x="439" y="164.2" text-anchor="middle">A:2→"edit A"<tspan x="439" dy="13">B:1→"edit B"</tspan></text>
  <text class="ds-annotation" x="507" y="53.2" text-anchor="start">A:2→"edit A"<tspan x="507" dy="13">B:1→"edit B"</tspan></text>
  <text class="ds-annotation" x="583" y="147.2" text-anchor="middle">B:2→"merged"</text>
  <text class="ds-annotation" x="651" y="53.2" text-anchor="start">B:2→"merged"</text>
  <text class="ds-annotation" x="795" y="53.2" text-anchor="middle">B:2→"merged"</text>
  <line class="ds-message" x1="127.3" y1="38.6" x2="184.7" y2="113.5"/>
  <polygon class="ds-arrow" points="190.1,120.6 181.9,115.6 187.4,111.4"/>
  <line class="ds-message" x1="273.1" y1="36.4" x2="424.1" y2="118.8"/>
  <polygon class="ds-arrow" points="432,123.2 422.4,121.9 425.8,115.8"/>
  <line class="ds-message" x1="443.3" y1="121.4" x2="500.7" y2="46.5"/>
  <polygon class="ds-arrow" points="506.1,39.4 503.4,48.6 497.9,44.4"/>
  <line class="ds-message" x1="587.3" y1="121.4" x2="644.7" y2="46.5"/>
  <polygon class="ds-arrow" points="650.1,39.4 647.4,48.6 641.9,44.4"/>
  <circle class="ds-callout-ring" cx="195" cy="127" r="9"/>
  <circle class="ds-callout-ring" cx="439" cy="127" r="9"/>
  <circle class="ds-callout-ring" cx="511" cy="33" r="9"/>
  <circle class="ds-callout-ring" cx="795" cy="33" r="9"/>
  <text class="ds-callout-mark" x="207" y="131" text-anchor="start">2</text>
  <text class="ds-callout-mark" x="451" y="131" text-anchor="start">1</text>
  <text class="ds-callout-mark" x="523" y="37" text-anchor="start">1</text>
  <text class="ds-callout-mark" x="807" y="37" text-anchor="start">2</text>
  <text class="ds-callout" x="35" y="211" text-anchor="start">1. r1 and r2 agree: A:2 and B:1 are siblings, since neither writer was shown the other's value</text>
  <text class="ds-callout" x="35" y="229" text-anchor="start">2. a copy of r2 taken right after its first sync still holds A:1, but r1 has already seen that write, so</text>
  <text class="ds-callout" x="51" y="247" text-anchor="start">"draft" is not resurrected</text>
</svg>
