<div class="ds-beats">
<p class="ds-beat" data-in="0" data-out="1" data-event="a-votes"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="A" data-actor-n="1">from user</span> on <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> votes to accept the user's command: reserve a seat on flight 221 for Smith. The user issued it at 1, so it's stamped 1, and it reached <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> at 4, before 1 + δ = 11 (δ is 10 here). <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> sends its vote to <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> and <span class="ds-actor" data-actor="C" data-actor-n="3">C</span></span></p>
<p class="ds-beat" data-in="1" data-out="2" data-cont="" data-event="a-crashes"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="A" data-actor-n="1">crash</span> on <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> crashes as its vote goes out. Nothing sent to <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> from now on is delivered</span></p>
<p class="ds-beat" data-in="2" data-out="3" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body"><span class="ds-actor" data-actor="A" data-actor-n="1">A</span> votes for <code class="ds-v"><span class="ds-command ds-time" data-command="1:reserve 221 Smith">1</span><span class="ds-command" data-command="1:reserve 221 Smith">:</span><span class="ds-command" data-command="1:reserve 221 Smith">reserve 221 Smith</span></code> and crashes. Its vote still reaches <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> and <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>, but everything sent to <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> afterwards goes nowhere</span></p>
<p class="ds-beat" data-in="3" data-out="4" data-cont="" data-event="b-1"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="B" data-actor-n="2">vote from A</span> on <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> hears of the command at 9, before 1 + 2δ = 21, and votes too. <code class="ds-v">{<span class="ds-voter ds-actor" data-actor="A" data-actor-n="1">A</span>,<span class="ds-voter ds-actor" data-actor="B" data-actor-n="2">B</span>}</code> is a majority graph, so the command is accepted, and the message <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> sends with its vote says so</span></p>
<p class="ds-beat" data-in="4" data-out="5" data-cont="" data-event="c-1"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="C" data-actor-n="3">vote from A</span> on <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> votes too: <code class="ds-v">{<span class="ds-voter ds-actor" data-actor="A" data-actor-n="1">A</span>,<span class="ds-voter ds-actor" data-actor="C" data-actor-n="3">C</span>}</code> is another majority graph, so <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>'s message says the command is accepted, as <span class="ds-actor" data-actor="B" data-actor-n="2">B</span>'s did</span></p>
<p class="ds-beat" data-in="5" data-out="6" data-cont="" data-event="b-2"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="B" data-actor-n="2">votes from C</span> on <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> learns that <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> voted too. The message <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> sent with its vote at 9 already said the command is accepted, so <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> sends nothing</span></p>
<p class="ds-beat" data-in="6" data-out="7" data-cont="" data-event="c-2"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="C" data-actor-n="3">votes from B</span> on <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> learns that <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> voted too, and likewise sends nothing</span></p>
<p class="ds-beat" data-in="7" data-out="8" data-cont="" data-event="b-closes"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="B" data-actor-n="2">voting closes</span> on <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> at 21: from now on <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> votes for nothing stamped 1 or earlier, and its message says so just by when it was sent. <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> can't execute the command yet: it has heard from <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> only up to 4 and from <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> only up to 12, so for all <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> knows, <code class="ds-v">{<span class="ds-voter ds-actor" data-actor="A" data-actor-n="1">A</span>,<span class="ds-voter ds-actor" data-actor="C" data-actor-n="3">C</span>}</code> accepted another command stamped 1</span></p>
<p class="ds-beat" data-in="8" data-out="9" data-cont="" data-event="c-closes"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="C" data-actor-n="3">voting closes</span> on <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> at 21 too, and <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>'s message says so the same way</span></p>
<p class="ds-beat" data-in="9" data-out="10" data-cont="" data-event="b-executes"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="B" data-actor-n="2">close from C</span> on <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> hears that <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>'s voting closed at 21 too. Every majority graph includes <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> or <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>, so no command stamped 1 or earlier that neither voted for can be accepted. <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> now knows every accepted command up to 1, says so to <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>, and executes the one there is: Smith is booked</span></p>
<p class="ds-beat" data-in="10" data-out="11" data-cont="" data-event="c-executes"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="C" data-actor-n="3">close from B</span> on <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> hears the same, books Smith too, and says so to <span class="ds-actor" data-actor="B" data-actor-n="2">B</span>. The figure ends with both of those messages on their way. Neither <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> nor <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> has heard from <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> since the vote it sent at 4</span></p>
<p class="ds-beat" data-in="11" data-cont="" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-beat-body"><span class="ds-actor" data-actor="B" data-actor-n="2">B</span> and <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> have each heard from the other since voting closed at 21, and every majority graph includes <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> or <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>, so without <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> they know every accepted command up to 1: both book Smith</span></p>

<figcaption class="ds-fig-caption">
<p class="ds-fig-title">Lamport's bookkeepers: A crashes, and B and C carry on</p>
<ol class="ds-notes">
<li class="ds-note" data-in="2" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-note-body"><span class="ds-actor" data-actor="A" data-actor-n="1">A</span> votes for <code class="ds-v"><span class="ds-command ds-time" data-command="1:reserve 221 Smith">1</span><span class="ds-command" data-command="1:reserve 221 Smith">:</span><span class="ds-command" data-command="1:reserve 221 Smith">reserve 221 Smith</span></code> and crashes. Its vote still reaches <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> and <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>, but everything sent to <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> afterwards goes nowhere</span></li>
<li class="ds-note" data-in="11" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-note-body"><span class="ds-actor" data-actor="B" data-actor-n="2">B</span> and <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> have each heard from the other since voting closed at 21, and every majority graph includes <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> or <span class="ds-actor" data-actor="C" data-actor-n="3">C</span>, so without <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> they know every accepted command up to 1: both book Smith</span></li>
</ol>
