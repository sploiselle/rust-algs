<svg xmlns="http://www.w3.org/2000/svg" class="ds-figure" data-figure="lamport-register-lost-write" data-kind="space-time" role="img" viewBox="0 0 583 304" width="583" height="304" style="--ds-w: 583" fill="currentColor" font-family="system-ui, sans-serif">
  <title>Last writer wins on Lamport stamps: B never saw milk, which is lost</title>
  <desc>Timelines for A, B. write milk on A: L 1; x (1,A)→"milk". local on B: L 1; x (empty). local on B: L 2; x (empty). write eggs on B: L 3; x (3,B)→"eggs". sync on A, receiving (3,B)→"eggs" from write eggs on B: L 4; x (3,B)→"eggs". Note 1: milk is concurrent with eggs: B never heard from A. Yet the stamps are the same as when B saw milk, (1,A) and (3,B), so nothing in them can tell. Note 2: A drops "milk" for "eggs" and ends exactly as when B saw milk: no one chose to discard "milk", and nothing on either replica records it was written.</desc>
  <style>
    @layer ds-figure {
      .ds-figure { max-width: 100%; height: auto; font-family: var(--ds-font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
      .ds-figure:root { color-scheme: light dark; color: CanvasText; }
      .ds-figure text { fill: var(--ds-ink, currentColor); }
      .ds-figure :is(.ds-event-value, .ds-row-value, .ds-v) { font-family: var(--ds-font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .ds-figure .ds-sym { font-family: var(--ds-font-sym, system-ui, sans-serif); }
      .ds-figure .ds-lane-line { stroke: var(--ds-lane-line, var(--ds-rule, var(--ds-ink, currentColor))); stroke-opacity: var(--ds-lane-opacity, .5); stroke-width: var(--ds-lane-width, 1); }
      .ds-figure .ds-lane-head { fill: var(--ds-lane-line, var(--ds-rule, var(--ds-ink, currentColor))); fill-opacity: var(--ds-lane-opacity, .5); }
      .ds-figure [data-actor-n="1"] { --ds-actor: var(--ds-actor-1); }
      .ds-figure [data-actor-n="2"] { --ds-actor: var(--ds-actor-2); }
      .ds-figure [data-actor-n="3"] { --ds-actor: var(--ds-actor-3); }
      .ds-figure [data-actor-n="4"] { --ds-actor: var(--ds-actor-4); }
      .ds-figure [data-actor-n="5"] { --ds-actor: var(--ds-actor-5); }
      .ds-figure [data-actor-n="6"] { --ds-actor: var(--ds-actor-6); }
      .ds-figure [data-actor-n="7"] { --ds-actor: var(--ds-actor-7); }
      .ds-figure [data-actor-n="8"] { --ds-actor: var(--ds-actor-8); }
      .ds-figure .ds-actor { fill: var(--ds-actor); }
      .ds-figure .ds-lane-name { fill: var(--ds-lane-name, var(--ds-actor, var(--ds-ink, currentColor))); font-weight: 600; }
      .ds-figure .ds-row-name { fill: var(--ds-lane-name, var(--ds-ink, currentColor)); font-weight: 600; }
      .ds-figure .ds-event-dot { fill: var(--ds-event-dot, var(--ds-ink, currentColor)); }
      .ds-figure .ds-event-name { fill: var(--ds-event-name, var(--ds-muted, var(--ds-ink, currentColor))); }
      .ds-figure .ds-field { fill: var(--ds-field, var(--ds-muted, var(--ds-ink, currentColor))); }
      .ds-figure :is(.ds-event-value, .ds-row-value) { fill: var(--ds-value, var(--ds-ink, currentColor)); }
      .ds-figure .ds-message-line { fill: none; stroke: var(--ds-message-line, var(--ds-ink, currentColor)); stroke-width: var(--ds-message-width, 1.5); }
      .ds-figure .ds-message-head { fill: var(--ds-message-line, var(--ds-ink, currentColor)); }
      .ds-figure .ds-message-label { fill: var(--ds-message-label, var(--ds-muted, var(--ds-ink, currentColor))); }
      .ds-figure .ds-ring { fill: none; stroke: var(--ds-accent, var(--ds-ink, currentColor)); stroke-width: var(--ds-ring-width, 1.5); stroke-dasharray: var(--ds-ring-dash, none); }
      .ds-figure .ds-badge-disc { fill: var(--ds-accent, var(--ds-ink, currentColor)); }
      .ds-figure .ds-badge-n { fill: var(--ds-on-accent, Canvas); font-weight: 700; }
      .ds-figure .ds-caption { fill: var(--ds-caption, var(--ds-ink, currentColor)); }
      .ds-figure :is(.ds-counter, .ds-legend) { fill: var(--ds-muted, var(--ds-ink, currentColor)); }
      .ds-figure :is(.ds-dot, .ds-claim) { fill: var(--ds-dot, var(--ds-ink, currentColor)); }
      .ds-figure .ds-dot.ds-gap { fill: none; stroke: var(--ds-gap, var(--ds-ink, currentColor)); stroke-width: 1.5; stroke-dasharray: 3 2; }
      .ds-figure .ds-wrong { fill: var(--ds-wrong, var(--ds-accent, var(--ds-ink, currentColor))); font-weight: 700; }
    }
  </style>
  <g class="ds-lanes">
    <g class="ds-lane" data-lane="a" data-actor="A" data-actor-n="1">
      <line class="ds-lane-line" x1="28" y1="33" x2="575" y2="33" stroke="currentColor" stroke-opacity=".5"/>
      <polygon class="ds-lane-head" points="575,29 583,33 575,37" fill-opacity=".5"/>
      <text class="ds-lane-name" x="18" y="38" text-anchor="end" font-size="14">A</text>
    </g>
    <g class="ds-lane" data-lane="b" data-actor="B" data-actor-n="2">
      <line class="ds-lane-line" x1="28" y1="114" x2="575" y2="114" stroke="currentColor" stroke-opacity=".5"/>
      <polygon class="ds-lane-head" points="575,110 583,114 575,118" fill-opacity=".5"/>
      <text class="ds-lane-name" x="18" y="119" text-anchor="end" font-size="14">B</text>
    </g>
  </g>
  <g class="ds-messages">
    <g class="ds-message" data-message="eggs-to-a" data-from="eggs" data-to="a-syncs" data-notes="2">
      <line class="ds-message-line" x1="385.8" y1="105.8" x2="436.5" y2="48.7" stroke="currentColor" stroke-width="1.5"/>
      <polygon class="ds-message-head" points="442.5,42 439.2,51 433.9,46.4"/>
      <text class="ds-message-label" x="407" y="66.9" text-anchor="end" font-size="12"><tspan class="ds-v" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-stamp" data-stamp="3,B">(</tspan><tspan class="ds-stamp ds-time" data-stamp="3,B">3</tspan><tspan class="ds-stamp" data-stamp="3,B">,</tspan><tspan class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</tspan><tspan class="ds-stamp" data-stamp="3,B">)</tspan><tspan class="ds-sym">→</tspan><tspan class="ds-str">"eggs"</tspan></tspan></text>
    </g>
  </g>
  <g class="ds-events">
    <g class="ds-event" data-event="milk" data-lane="a" data-actor="A" data-actor-n="1" data-notes="1">
      <circle class="ds-event-dot" cx="102" cy="33" r="5"/>
      <text class="ds-event-name" x="102" y="17.8" text-anchor="middle" font-size="13">write milk</text>
      <text class="ds-event-value" x="102" y="54.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">1</tspan>           <tspan x="102" dy="15"><tspan class="ds-field">x </tspan><tspan class="ds-stamp" data-stamp="1,A">(</tspan><tspan class="ds-stamp ds-time" data-stamp="1,A">1</tspan><tspan class="ds-stamp" data-stamp="1,A">,</tspan><tspan class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</tspan><tspan class="ds-stamp" data-stamp="1,A">)</tspan><tspan class="ds-sym">→</tspan><tspan class="ds-str">"milk"</tspan></tspan></text>
    </g>
    <g class="ds-event" data-event="b-1" data-lane="b" data-actor="B" data-actor-n="2">
      <circle class="ds-event-dot" cx="174" cy="114" r="5"/>
      <text class="ds-event-name" x="174" y="98.8" text-anchor="middle" font-size="13">local</text>
      <text class="ds-event-value" x="174" y="135.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">1</tspan>      <tspan x="174" dy="15"><tspan class="ds-field">x </tspan><tspan class="ds-empty">(empty)</tspan></tspan></text>
    </g>
    <g class="ds-event" data-event="b-2" data-lane="b" data-actor="B" data-actor-n="2">
      <circle class="ds-event-dot" cx="265" cy="114" r="5"/>
      <text class="ds-event-name" x="265" y="98.8" text-anchor="middle" font-size="13">local</text>
      <text class="ds-event-value" x="265" y="135.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">2</tspan>      <tspan x="265" dy="15"><tspan class="ds-field">x </tspan><tspan class="ds-empty">(empty)</tspan></tspan></text>
    </g>
    <g class="ds-event" data-event="eggs" data-lane="b" data-actor="B" data-actor-n="2" data-notes="1 2">
      <circle class="ds-event-dot" cx="378.5" cy="114" r="5"/>
      <text class="ds-event-name" x="382.5" y="98.8" text-anchor="end" font-size="13">write eggs</text>
      <text class="ds-event-value" x="378.5" y="135.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">3</tspan>           <tspan x="378.5" dy="15"><tspan class="ds-field">x </tspan><tspan class="ds-stamp" data-stamp="3,B">(</tspan><tspan class="ds-stamp ds-time" data-stamp="3,B">3</tspan><tspan class="ds-stamp" data-stamp="3,B">,</tspan><tspan class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</tspan><tspan class="ds-stamp" data-stamp="3,B">)</tspan><tspan class="ds-sym">→</tspan><tspan class="ds-str">"eggs"</tspan></tspan></text>
    </g>
    <g class="ds-event" data-event="a-syncs" data-lane="a" data-actor="A" data-actor-n="1" data-notes="2">
      <circle class="ds-event-dot" cx="450.5" cy="33" r="5"/>
      <text class="ds-event-name" x="450.5" y="17.8" text-anchor="middle" font-size="13">sync</text>
      <text class="ds-event-value" x="446.5" y="54.8" text-anchor="start" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">4</tspan>           <tspan x="446.5" dy="15"><tspan class="ds-field">x </tspan><tspan class="ds-stamp" data-stamp="3,B">(</tspan><tspan class="ds-stamp ds-time" data-stamp="3,B">3</tspan><tspan class="ds-stamp" data-stamp="3,B">,</tspan><tspan class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</tspan><tspan class="ds-stamp" data-stamp="3,B">)</tspan><tspan class="ds-sym">→</tspan><tspan class="ds-str">"eggs"</tspan></tspan></text>
    </g>
  </g>
  <g class="ds-marks">
    <circle class="ds-ring" data-event="milk" data-notes="1" cx="102" cy="33" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle class="ds-ring" data-event="eggs" data-notes="1 2" cx="378.5" cy="114" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle class="ds-ring" data-event="a-syncs" data-notes="2" cx="450.5" cy="33" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <g class="ds-badge" data-note="1" data-event="milk" data-relation="concurrent">
      <circle class="ds-badge-disc" cx="150" cy="14.5" r="7.5"/>
      <text class="ds-badge-n" x="150" y="18.5" text-anchor="middle" font-size="11" fill="Canvas">1</text>
    </g>
    <g class="ds-badge" data-note="1" data-event="eggs" data-relation="concurrent">
      <circle class="ds-badge-disc" cx="398" cy="114" r="7.5"/>
      <text class="ds-badge-n" x="398" y="118" text-anchor="middle" font-size="11" fill="Canvas">1</text>
    </g>
    <g class="ds-badge" data-note="2" data-event="eggs">
      <circle class="ds-badge-disc" cx="416" cy="114" r="7.5"/>
      <text class="ds-badge-n" x="416" y="118" text-anchor="middle" font-size="11" fill="Canvas">2</text>
    </g>
    <g class="ds-badge" data-note="2" data-event="a-syncs">
      <circle class="ds-badge-disc" cx="477" cy="14.5" r="7.5"/>
      <text class="ds-badge-n" x="477" y="18.5" text-anchor="middle" font-size="11" fill="Canvas">2</text>
    </g>
  </g>
  <g class="ds-captions">
    <text class="ds-caption" data-note="1" x="28" y="186" text-anchor="start" font-size="14">1. milk is concurrent with eggs: B never heard from A. Yet the stamps</text>
    <text class="ds-caption" data-note="1" x="44" y="206" text-anchor="start" font-size="14">are the same as when B saw milk, (1,A) and (3,B), so nothing in</text>
    <text class="ds-caption" data-note="1" x="44" y="226" text-anchor="start" font-size="14">them can tell</text>
    <text class="ds-caption" data-note="2" x="28" y="246" text-anchor="start" font-size="14">2. A drops "milk" for "eggs" and ends exactly as when B saw milk: no</text>
    <text class="ds-caption" data-note="2" x="44" y="266" text-anchor="start" font-size="14">one chose to discard "milk", and nothing on either replica records</text>
    <text class="ds-caption" data-note="2" x="44" y="286" text-anchor="start" font-size="14">it was written</text>
  </g>
</svg>
