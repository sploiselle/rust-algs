<svg xmlns="http://www.w3.org/2000/svg" class="ds-figure" role="img" viewBox="0 0 593 250" width="593" height="250">
  <title>Vector clocks: three processes, two messages</title>
  <style>
    .ds-figure { max-width: 100%; height: auto; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; }
    .ds-figure .ds-lane { stroke: currentColor; stroke-width: 1; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .ds-lane-arrow { fill: currentColor; opacity: var(--ds-lane-opacity, .35); }
    .ds-figure .ds-lane-name { fill: currentColor; font-weight: 600; }
    .ds-figure .ds-event { fill: var(--ds-event, currentColor); }
    .ds-figure .ds-name, .ds-figure .ds-label, .ds-figure .ds-callout { fill: currentColor; }
    .ds-figure .ds-label { font-size: 11px; }
    .ds-figure .ds-annotation { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: var(--ds-annotation, currentColor); }
    .ds-figure .ds-message { stroke: var(--ds-message, currentColor); stroke-width: 1.5; fill: none; }
    .ds-figure .ds-arrow { fill: var(--ds-message, currentColor); }
    .ds-figure .ds-callout-ring { fill: none; stroke: var(--ds-accent, currentColor); stroke-width: 1.5; stroke-dasharray: 2 2; }
    .ds-figure .ds-callout-mark { fill: var(--ds-accent, currentColor); font-size: 10px; font-weight: 700; }
    .ds-figure .ds-dot { fill: currentColor; }
    .ds-figure .ds-dot.ds-gap { fill: none; stroke: currentColor; stroke-dasharray: 3 2; }
    .ds-figure .ds-claim { fill: currentColor; }
    .ds-figure .ds-wrong { fill: var(--ds-wrong, currentColor); font-weight: 700; }
  </style>
  <line class="ds-lane" x1="28" y1="33" x2="585" y2="33"/>
  <polygon class="ds-lane-arrow" points="585,29 593,33 585,37"/>
  <text class="ds-lane-name" x="18" y="37" text-anchor="end">A</text>
  <line class="ds-lane" x1="28" y1="97" x2="585" y2="97"/>
  <polygon class="ds-lane-arrow" points="585,93 593,97 585,101"/>
  <text class="ds-lane-name" x="18" y="101" text-anchor="end">B</text>
  <line class="ds-lane" x1="28" y1="161" x2="585" y2="161"/>
  <polygon class="ds-lane-arrow" points="585,157 593,161 585,165"/>
  <text class="ds-lane-name" x="18" y="165" text-anchor="end">C</text>
  <circle class="ds-event" cx="58.5" cy="33" r="5"/>
  <circle class="ds-event" cx="130.5" cy="33" r="5"/>
  <circle class="ds-event" cx="202.5" cy="97" r="5"/>
  <circle class="ds-event" cx="274.5" cy="97" r="5"/>
  <circle class="ds-event" cx="346.5" cy="161" r="5"/>
  <circle class="ds-event" cx="418.5" cy="97" r="5"/>
  <circle class="ds-event" cx="490.5" cy="161" r="5"/>
  <circle class="ds-event" cx="562.5" cy="33" r="5"/>
  <text class="ds-name" x="58.5" y="17.8" text-anchor="middle">A1</text>
  <text class="ds-name" x="130.5" y="17.8" text-anchor="middle">A2</text>
  <text class="ds-name" x="202.5" y="81.8" text-anchor="middle">B1</text>
  <text class="ds-name" x="270.5" y="81.8" text-anchor="start">B2</text>
  <text class="ds-name" x="346.5" y="145.8" text-anchor="middle">C1</text>
  <text class="ds-name" x="418.5" y="81.8" text-anchor="middle">B3</text>
  <text class="ds-name" x="486.5" y="145.8" text-anchor="start">C2</text>
  <text class="ds-name" x="562.5" y="17.8" text-anchor="middle">A3</text>
  <text class="ds-annotation" x="58.5" y="53.2" text-anchor="middle">{A:1}</text>
  <text class="ds-annotation" x="134.5" y="53.2" text-anchor="end">{A:2}</text>
  <text class="ds-annotation" x="202.5" y="117.2" text-anchor="middle">{B:1}</text>
  <text class="ds-annotation" x="274.5" y="117.2" text-anchor="middle">{A:2, B:2}</text>
  <text class="ds-annotation" x="346.5" y="181.2" text-anchor="middle">{C:1}</text>
  <text class="ds-annotation" x="422.5" y="117.2" text-anchor="end">{A:2, B:3}</text>
  <text class="ds-annotation" x="490.5" y="181.2" text-anchor="middle">{A:2, B:3, C:2}</text>
  <text class="ds-annotation" x="562.5" y="53.2" text-anchor="middle">{A:3}</text>
  <line class="ds-message" x1="136.9" y1="35.8" x2="259" y2="90.1"/>
  <polygon class="ds-arrow" points="267.2,93.8 257.5,93.3 260.4,86.9"/>
  <line class="ds-message" x1="423.7" y1="101.7" x2="477.8" y2="149.7"/>
  <polygon class="ds-arrow" points="484.5,155.7 475.5,152.3 480.1,147.1"/>
  <text class="ds-label" x="206.6" y="55.9" text-anchor="start">m1 {A:2}</text>
  <text class="ds-label" x="461.1" y="121.5" text-anchor="start">m2 {A:2, B:3}</text>
  <circle class="ds-callout-ring" cx="58.5" cy="33" r="9"/>
  <circle class="ds-callout-ring" cx="418.5" cy="97" r="9"/>
  <circle class="ds-callout-ring" cx="490.5" cy="161" r="9"/>
  <circle class="ds-callout-ring" cx="562.5" cy="33" r="9"/>
  <text class="ds-callout-mark" x="70.5" y="37" text-anchor="start">2</text>
  <text class="ds-callout-mark" x="430.5" y="101" text-anchor="start">1</text>
  <text class="ds-callout-mark" x="502.5" y="165" text-anchor="start">2</text>
  <text class="ds-callout-mark" x="574.5" y="37" text-anchor="start">1</text>
  <text class="ds-callout" x="28" y="215" text-anchor="start">1. A3 ∥ B3: {A:3} and {A:2, B:3} are incomparable, though A3 happened last</text>
  <text class="ds-callout" x="28" y="233" text-anchor="start">2. A1 → C2: {A:1} &lt; {A:2, B:3, C:2}, carried by m1 then m2</text>
</svg>
