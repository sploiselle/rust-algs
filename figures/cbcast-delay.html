<p class="ds-beat" data-in="0" data-out="1" data-event="question"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="A" data-actor-n="1">question</span> on <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> broadcasts it, stamped <code class="ds-v">{<span class="ds-entry ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-entry ds-count" data-actor="A" data-actor-n="1">:1</span>}</code>: the stamp counts one broadcast from A, this one, and A delivers it as it sends it</span></p>
<p class="ds-beat" data-in="1" data-out="2" data-cont="" data-event="b-1"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="B" data-actor-n="2">question from A</span> on <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> delivers the question as it arrives: it is the first from A, and its stamp counts no other broadcast</span></p>
<p class="ds-beat" data-in="2" data-out="3" data-cont="" data-event="answer"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="B" data-actor-n="2">answer</span> on <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> replies, stamped <code class="ds-v">{<span class="ds-entry ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-entry ds-count" data-actor="A" data-actor-n="1">:1</span>, <span class="ds-entry ds-actor" data-actor="B" data-actor-n="2">B</span><span class="ds-entry ds-count" data-actor="B" data-actor-n="2">:1</span>}</code>: the stamp counts the question, which B delivered before replying</span></p>
<p class="ds-beat" data-in="3" data-out="4" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body">The question happened before the answer: B delivered it, then answered. So everyone must deliver the question first</span></p>
<p class="ds-beat" data-in="4" data-out="5" data-cont="" data-event="c-delays"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="C" data-actor-n="3">answer from B</span> on <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> gets the answer first and delays it: it is the next from B, but C hasn't delivered the question it counts</span></p>
<p class="ds-beat" data-in="5" data-out="6" data-cont="" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-beat-body">The answer <code class="ds-v">{<span class="ds-entry ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-entry ds-count" data-actor="A" data-actor-n="1">:1</span>, <span class="ds-entry ds-actor" data-actor="B" data-actor-n="2">B</span><span class="ds-entry ds-count" data-actor="B" data-actor-n="2">:1</span>}</code> reaches C first. It comes from another sender, so FIFO channels wouldn't stop that, but it counts a broadcast from A that C hasn't delivered, so C delays it</span></p>
<p class="ds-beat" data-in="6" data-out="7" data-cont="" data-event="a-2"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="A" data-actor-n="1">answer from B</span> on <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> delivers the answer as it arrives: A has delivered the question it counts</span></p>
<p class="ds-beat" data-in="7" data-out="8" data-cont="" data-event="c-delivers"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="C" data-actor-n="3">question from A</span> on <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> delivers the question, and with it the delayed answer</span></p>
<p class="ds-beat" data-in="8" data-cont="" data-note="3"><span class="ds-note-n" aria-hidden="true">3</span> <span class="ds-beat-body">The question reaches C at last. C delivers it, and then the answer, which was waiting only on the question</span></p>
</div>
