<div class="ds-beats">
<p class="ds-beat" data-in="0" data-out="1"><span class="ds-beat-body">Timelines for A, B; time runs left to right</span></p>
<p class="ds-beat" data-in="1" data-out="2" data-cont="" data-event="a-1"><span class="ds-beat-body"><span class="ds-lead">request</span> on A asks for the resource: stamps its request <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code>, queues it, and sends it to B</span></p>
<p class="ds-beat" data-in="2" data-out="3" data-cont="" data-event="b-1"><span class="ds-beat-body"><span class="ds-lead">request</span> on B asks too, at the same Lamport time: <code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code> ranks after <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code>, since A's id is smaller</span></p>
<p class="ds-beat" data-in="3" data-out="4" data-cont="" data-event="a-enters"><span class="ds-beat-body"><span class="ds-lead">req from B</span> on A queues B's request behind its own and acks it. Its request is first, and it has heard from B past it, so A enters</span></p>
<p class="ds-beat" data-in="4" data-out="5" data-cont="" data-event="b-2"><span class="ds-beat-body"><span class="ds-lead">req from A</span> on B, receiving req <code class="ds-v">1</code> from request on A, sending ack <code class="ds-v">3</code> to A: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">3</span></code>; <span class="ds-field">queue </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span> <span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code>; <span class="ds-field">heard </span><code class="ds-v"><span class="ds-heard ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-heard ds-count" data-actor="A" data-actor-n="1">:1</span></code>; <span class="ds-field">holds </span><code class="ds-v"><span class="ds-holds">no</span></code></span></p>
<p class="ds-beat" data-in="5" data-out="6" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body">A's request <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> reaches B before anything A sent after it, and goes ahead of B's own <code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code> in B's queue</span></p>
<p class="ds-beat" data-in="6" data-out="7" data-cont="" data-event="b-waits"><span class="ds-beat-body"><span class="ds-lead">ack from A</span> on B, receiving ack <code class="ds-v">3</code> from req from B on A: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">4</span></code>; <span class="ds-field">queue </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span> <span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code>; <span class="ds-field">heard </span><code class="ds-v"><span class="ds-heard ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-heard ds-count" data-actor="A" data-actor-n="1">:3</span></code>; <span class="ds-field">holds </span><code class="ds-v"><span class="ds-holds">no</span></code></span></p>
<p class="ds-beat" data-in="7" data-out="8" data-cont="" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-beat-body">B has heard from A at <code class="ds-v">3</code>, later than its request, but A's request is first in its queue, so B waits</span></p>
<p class="ds-beat" data-in="8" data-out="9" data-cont="" data-event="a-3"><span class="ds-beat-body"><span class="ds-lead">ack from B</span> on A, receiving ack <code class="ds-v">3</code> from req from A on B: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">4</span></code>; <span class="ds-field">queue </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span> <span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code>; <span class="ds-field">heard </span><code class="ds-v"><span class="ds-heard ds-actor" data-actor="B" data-actor-n="2">B</span><span class="ds-heard ds-count" data-actor="B" data-actor-n="2">:3</span></code>; <span class="ds-field">holds </span><code class="ds-v"><span class="ds-holds">yes</span></code></span></p>
<p class="ds-beat" data-in="9" data-out="10" data-cont="" data-event="a-4"><span class="ds-beat-body"><span class="ds-lead">release</span> on A leaves: drops its request <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> from its queue and sends a release to B</span></p>
<p class="ds-beat" data-in="10" data-out="11" data-cont="" data-event="b-enters"><span class="ds-beat-body"><span class="ds-lead">release from A</span> on B, receiving release <code class="ds-v">5</code> from release on A: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">6</span></code>; <span class="ds-field">queue </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code>; <span class="ds-field">heard </span><code class="ds-v"><span class="ds-heard ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-heard ds-count" data-actor="A" data-actor-n="1">:5</span></code>; <span class="ds-field">holds </span><code class="ds-v"><span class="ds-holds">yes</span></code></span></p>
<p class="ds-beat" data-in="11" data-out="12" data-cont="" data-note="3"><span class="ds-note-n" aria-hidden="true">3</span> <span class="ds-beat-body">A releases: B drops <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> from its queue, its own request is first, and B enters</span></p>
<p class="ds-beat" data-in="12" data-cont=""><span class="ds-beat-body">Lamport's mutex over FIFO channels: B waits its turn</span></p>
</div>

<ol class="ds-notes">
<li class="ds-note" data-in="5" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-note-body">A's request <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> reaches B before anything A sent after it, and goes ahead of B's own <code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code> in B's queue</span></li>
<li class="ds-note" data-in="7" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-note-body">B has heard from A at <code class="ds-v">3</code>, later than its request, but A's request is first in its queue, so B waits</span></li>

</ol>
