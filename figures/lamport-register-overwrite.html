<p class="ds-beat" data-in="3" data-out="4" data-cont="" data-event="eggs"><span class="ds-beat-body"><span class="ds-lead">write eggs</span> on B writes "eggs", stamped <code class="ds-v"><span class="ds-stamp" data-stamp="3,B">(</span><span class="ds-stamp ds-time" data-stamp="3,B">3</span><span class="ds-stamp" data-stamp="3,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="3,B">)</span></code>, replacing "milk", which it was shown</span></p>
<p class="ds-beat" data-in="4" data-out="5" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body">milk happened before eggs: B was shown milk and chose to replace it, so <code class="ds-v"><span class="ds-stamp" data-stamp="3,B">(</span><span class="ds-stamp ds-time" data-stamp="3,B">3</span><span class="ds-stamp" data-stamp="3,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="3,B">)</span></code> winning over <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> is right</span></p>
