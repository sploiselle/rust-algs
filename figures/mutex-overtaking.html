<p class="ds-beat" data-in="0" data-out="1" data-event="a-1"><span class="ds-beat-body"><span class="ds-lead">request</span> on A asks for the resource: stamps its request <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code>, queues it, and sends it to B</span></p>
<p class="ds-beat" data-in="1" data-out="2" data-cont="" data-event="b-1"><span class="ds-beat-body"><span class="ds-lead">request</span> on B asks too, at the same Lamport time: <code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code> ranks after <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code>, since A's id is smaller</span></p>
<p class="ds-beat" data-in="2" data-out="3" data-cont="" data-event="a-enters"><span class="ds-beat-body"><span class="ds-lead">req from B</span> on A queues B's request behind its own and acks it. Its request is first, and it has heard from B past it, so A enters</span></p>
<p class="ds-beat" data-in="3" data-out="4" data-cont="" data-event="b-enters"><span class="ds-beat-body"><span class="ds-lead">ack from A</span> on B gets A's ack before A's earlier request, which is still on its way, and enters while A holds</span></p>
<p class="ds-beat" data-in="4" data-out="5" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body">A's ack, sent after its request, arrives first: B has heard from A at <code class="ds-v">3</code>, later than its own request <code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code>, decides nothing earlier from A is on the way, and enters while A holds</span></p>
<p class="ds-beat" data-in="5" data-out="6" data-cont="" data-event="b-3"><span class="ds-beat-body"><span class="ds-lead">req from A</span> on B gets A's request at last: <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> goes ahead of its own, so B no longer holds by its queue, but it is already in</span></p>
<p class="ds-beat" data-in="6" data-out="7" data-cont="" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-beat-body">A's request <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> arrives at last and goes to the head of B's queue, but B is already in</span></p>
<p class="ds-beat" data-in="7" data-cont="" data-event="a-3"><span class="ds-beat-body"><span class="ds-lead">ack from B</span> on A receives ack <code class="ds-v">6</code> from B</span></p>
</div>
