<p class="ds-beat" data-in="0" data-out="1"><span class="ds-beat-body">Timelines for r1, r2; time runs left to right</span></p>
<p class="ds-beat" data-in="1" data-out="2" data-cont="" data-event="r1-1"><span class="ds-beat-body"><span class="ds-lead">write</span> on r1 writes "draft", tagged with the dot <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="A" data-dot="A:1" data-actor-n="1">A</span><span class="ds-dot-id ds-count" data-actor="A" data-dot="A:1" data-actor-n="1">:1</span></code></span></p>
<p class="ds-beat" data-in="2" data-out="3" data-cont="" data-event="r2-1"><span class="ds-beat-body"><span class="ds-lead">sync</span> on r2 syncs from r1 and takes "draft"</span></p>
<p class="ds-beat" data-in="3" data-out="4" data-cont="" data-event="r1-2"><span class="ds-beat-body"><span class="ds-lead">write</span> on r1 is shown only "draft", so "edit A" replaces it: dot <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="A" data-dot="A:2" data-actor-n="1">A</span><span class="ds-dot-id ds-count" data-actor="A" data-dot="A:2" data-actor-n="1">:2</span></code></span></p>
<p class="ds-beat" data-in="4" data-out="5" data-cont="" data-event="r2-2"><span class="ds-beat-body"><span class="ds-lead">write</span> on r2 is shown only "draft" too, so "edit B" replaces it: dot <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="B" data-dot="B:1" data-actor-n="2">B</span><span class="ds-dot-id ds-count" data-actor="B" data-dot="B:1" data-actor-n="2">:1</span></code>. Neither write saw the other</span></p>
<p class="ds-beat" data-in="5" data-out="6" data-cont="" data-event="r2-3"><span class="ds-beat-body"><span class="ds-lead">sync</span> on r2 syncs from r1 and holds both writes: neither was shown the other's, so they are siblings</span></p>
<p class="ds-beat" data-in="6" data-out="7" data-cont="" data-event="r1-3"><span class="ds-beat-body"><span class="ds-lead">sync</span> on r1 syncs from r2 and holds the same two siblings</span></p>
<p class="ds-beat" data-in="7" data-out="8" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body">r1 and r2 agree: <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="A" data-dot="A:2" data-actor-n="1">A</span><span class="ds-dot-id ds-count" data-actor="A" data-dot="A:2" data-actor-n="1">:2</span></code> and <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="B" data-dot="B:1" data-actor-n="2">B</span><span class="ds-dot-id ds-count" data-actor="B" data-dot="B:1" data-actor-n="2">:1</span></code> are siblings, since neither writer was shown the other's value</span></p>
<p class="ds-beat" data-in="8" data-out="9" data-cont="" data-event="r2-4"><span class="ds-beat-body"><span class="ds-lead">write</span> on r2 is shown both siblings, so "merged" replaces them: dot <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="B" data-dot="B:2" data-actor-n="2">B</span><span class="ds-dot-id ds-count" data-actor="B" data-dot="B:2" data-actor-n="2">:2</span></code></span></p>
<p class="ds-beat" data-in="9" data-out="10" data-cont="" data-event="r1-4"><span class="ds-beat-body"><span class="ds-lead">sync</span> on r1 syncs from r2: "merged" has seen both siblings, so they give way to it</span></p>
<p class="ds-beat" data-in="10" data-out="11" data-cont="" data-event="stale-sync"><span class="ds-beat-body"><span class="ds-lead">sync (stale)</span> on r1 syncs from the copy of r2 taken after its first sync, which still holds "draft"; r1 has already seen that write, so it stays gone</span></p>
<p class="ds-beat" data-in="11" data-out="12" data-cont="" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-beat-body">a copy of r2 taken right after its first sync still holds <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="A" data-dot="A:1" data-actor-n="1">A</span><span class="ds-dot-id ds-count" data-actor="A" data-dot="A:1" data-actor-n="1">:1</span></code>, but r1 has already seen that write, so "draft" is not resurrected</span></p>
<p class="ds-beat" data-in="12" data-cont=""><span class="ds-beat-body">Multi-value register: concurrent writes become siblings</span></p>
