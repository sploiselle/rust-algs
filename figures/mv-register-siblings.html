<figcaption class="ds-fig-caption">
<p class="ds-fig-title">Multi-value register: concurrent writes become siblings</p>
<ol class="ds-notes">
<li class="ds-note" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-note-body">r1 and r2 agree: <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="A" data-dot="A:2" data-actor-n="1">A</span><span class="ds-dot-id ds-count" data-actor="A" data-dot="A:2" data-actor-n="1">:2</span></code> and <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="B" data-dot="B:1" data-actor-n="2">B</span><span class="ds-dot-id ds-count" data-actor="B" data-dot="B:1" data-actor-n="2">:1</span></code> are siblings, since neither writer was shown the other's value</span></li>
<li class="ds-note" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-note-body">a copy of r2 taken right after its first sync still holds <code class="ds-v"><span class="ds-dot-id ds-actor" data-actor="A" data-dot="A:1" data-actor-n="1">A</span><span class="ds-dot-id ds-count" data-actor="A" data-dot="A:1" data-actor-n="1">:1</span></code>, but r1 has already seen that write, so "draft" is not resurrected</span></li>
</ol>
</figcaption>
