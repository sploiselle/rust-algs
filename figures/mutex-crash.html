<div class="ds-beats">
<p class="ds-beat" data-in="0" data-out="1"><span class="ds-beat-body">Timelines for A, B, C; time runs left to right</span></p>
<p class="ds-beat" data-in="1" data-out="2" data-cont="" data-event="b-1"><span class="ds-beat-body"><span class="ds-lead">request</span> on B asks for the resource: stamps its request <code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code>, queues it, and sends it to A and C</span></p>
<p class="ds-beat" data-in="2" data-out="3" data-cont="" data-event="c-1"><span class="ds-beat-body"><span class="ds-lead">request</span> on C asks too: <code class="ds-v"><span class="ds-stamp" data-stamp="1,C">(</span><span class="ds-stamp ds-time" data-stamp="1,C">1</span><span class="ds-stamp" data-stamp="1,C">,</span><span class="ds-stamp ds-actor" data-actor="C" data-stamp="1,C" data-actor-n="3">C</span><span class="ds-stamp" data-stamp="1,C">)</span></code> ranks after <code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code></span></p>
<p class="ds-beat" data-in="3" data-out="4" data-cont="" data-event="a-requests"><span class="ds-beat-body"><span class="ds-lead">request</span> on A asks too: <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> ranks first of the three, since A's id is the smallest</span></p>
<p class="ds-beat" data-in="4" data-out="5" data-cont="" data-event="a-crashes"><span class="ds-beat-body"><span class="ds-lead">crash</span> on A crashes before anything reaches it. B's and C's requests, already on their way, are never delivered</span></p>
<p class="ds-beat" data-in="5" data-out="6" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body">A crashes holding the earliest request, <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code>. Everything sent to it afterwards, B's and C's requests and their acks, goes nowhere</span></p>
<p class="ds-beat" data-in="6" data-out="7" data-cont="" data-event="b-2"><span class="ds-beat-body"><span class="ds-lead">req from A</span> on B queues <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> ahead of its own request and acks it, but the ack goes to a process that has crashed</span></p>
<p class="ds-beat" data-in="7" data-out="8" data-cont="" data-event="c-2"><span class="ds-beat-body"><span class="ds-lead">req from A</span> on C, receiving req <code class="ds-v">1</code> from request on A: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">3</span></code>; <span class="ds-field">queue </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span> <span class="ds-stamp" data-stamp="1,C">(</span><span class="ds-stamp ds-time" data-stamp="1,C">1</span><span class="ds-stamp" data-stamp="1,C">,</span><span class="ds-stamp ds-actor" data-actor="C" data-stamp="1,C" data-actor-n="3">C</span><span class="ds-stamp" data-stamp="1,C">)</span></code>; <span class="ds-field">heard </span><code class="ds-v"><span class="ds-heard ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-heard ds-count" data-actor="A" data-actor-n="1">:1</span> <span class="ds-heard ds-actor" data-actor="B" data-actor-n="2">B</span><span class="ds-heard ds-count" data-actor="B" data-actor-n="2">:0</span></code>; <span class="ds-field">holds </span><code class="ds-v"><span class="ds-holds">no</span></code></span></p>
<p class="ds-beat" data-in="8" data-out="9" data-cont="" data-event="b-3"><span class="ds-beat-body"><span class="ds-lead">req from C</span> on B, receiving req <code class="ds-v">1</code> from request on C, sending ack <code class="ds-v">5</code> to C: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">5</span></code>; <span class="ds-field">queue </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span> <span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span> <span class="ds-stamp" data-stamp="1,C">(</span><span class="ds-stamp ds-time" data-stamp="1,C">1</span><span class="ds-stamp" data-stamp="1,C">,</span><span class="ds-stamp ds-actor" data-actor="C" data-stamp="1,C" data-actor-n="3">C</span><span class="ds-stamp" data-stamp="1,C">)</span></code>; <span class="ds-field">heard </span><code class="ds-v"><span class="ds-heard ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-heard ds-count" data-actor="A" data-actor-n="1">:1</span> <span class="ds-heard ds-actor" data-actor="C" data-actor-n="3">C</span><span class="ds-heard ds-count" data-actor="C" data-actor-n="3">:1</span></code>; <span class="ds-field">holds </span><code class="ds-v"><span class="ds-holds">no</span></code></span></p>
<p class="ds-beat" data-in="9" data-out="10" data-cont="" data-event="c-3"><span class="ds-beat-body"><span class="ds-lead">req from B</span> on C, receiving req <code class="ds-v">1</code> from request on B, sending ack <code class="ds-v">5</code> to B: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">5</span></code>; <span class="ds-field">queue </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span> <span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span> <span class="ds-stamp" data-stamp="1,C">(</span><span class="ds-stamp ds-time" data-stamp="1,C">1</span><span class="ds-stamp" data-stamp="1,C">,</span><span class="ds-stamp ds-actor" data-actor="C" data-stamp="1,C" data-actor-n="3">C</span><span class="ds-stamp" data-stamp="1,C">)</span></code>; <span class="ds-field">heard </span><code class="ds-v"><span class="ds-heard ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-heard ds-count" data-actor="A" data-actor-n="1">:1</span> <span class="ds-heard ds-actor" data-actor="B" data-actor-n="2">B</span><span class="ds-heard ds-count" data-actor="B" data-actor-n="2">:1</span></code>; <span class="ds-field">holds </span><code class="ds-v"><span class="ds-holds">no</span></code></span></p>
<p class="ds-beat" data-in="10" data-out="11" data-cont="" data-event="b-waits"><span class="ds-beat-body"><span class="ds-lead">ack from C</span> on B has now heard from C past its request, but <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> is first in its queue, and only A can release it</span></p>
<p class="ds-beat" data-in="11" data-out="12" data-cont="" data-event="c-waits"><span class="ds-beat-body"><span class="ds-lead">ack from B</span> on C, receiving ack <code class="ds-v">5</code> from req from C on B: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">6</span></code>; <span class="ds-field">queue </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span> <span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span> <span class="ds-stamp" data-stamp="1,C">(</span><span class="ds-stamp ds-time" data-stamp="1,C">1</span><span class="ds-stamp" data-stamp="1,C">,</span><span class="ds-stamp ds-actor" data-actor="C" data-stamp="1,C" data-actor-n="3">C</span><span class="ds-stamp" data-stamp="1,C">)</span></code>; <span class="ds-field">heard </span><code class="ds-v"><span class="ds-heard ds-actor" data-actor="A" data-actor-n="1">A</span><span class="ds-heard ds-count" data-actor="A" data-actor-n="1">:1</span> <span class="ds-heard ds-actor" data-actor="B" data-actor-n="2">B</span><span class="ds-heard ds-count" data-actor="B" data-actor-n="2">:5</span></code>; <span class="ds-field">holds </span><code class="ds-v"><span class="ds-holds">no</span></code></span></p>
<p class="ds-beat" data-in="12" data-out="13" data-cont="" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-beat-body">B and C have each heard from the other past their own requests, but <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> heads both queues, and only A can release it: neither ever enters</span></p>
<p class="ds-beat" data-in="13" data-cont=""><span class="ds-beat-body">Lamport's mutex: A crashes, and no one enters again</span></p>

<p class="ds-fig-title">Lamport's mutex: A crashes, and no one enters again</p>
<ol class="ds-notes">
<li class="ds-note" data-in="5" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-note-body">A crashes holding the earliest request, <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code>. Everything sent to it afterwards, B's and C's requests and their acks, goes nowhere</span></li>
<li class="ds-note" data-in="12" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-note-body">B and C have each heard from the other past their own requests, but <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> heads both queues, and only A can release it: neither ever enters</span></li>
</ol>
