<p class="ds-beat" data-in="1" data-out="2" data-cont="" data-event="a-crashes"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="A" data-actor-n="1">crash</span> on <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> crashes, with <span class="ds-actor" data-actor="B" data-actor-n="2">B</span>'s request still on its way. Nothing sent to <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> is ever delivered</span></p>
<p class="ds-beat" data-in="2" data-out="3" data-cont="" data-event="c-acks"><span class="ds-beat-body"><span class="ds-lead ds-actor" data-actor="C" data-actor-n="3">req from B</span> on <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> queues <span class="ds-actor" data-actor="B" data-actor-n="2">B</span>'s request and acks it</span></p>

<p class="ds-beat" data-in="4" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body"><span class="ds-actor" data-actor="B" data-actor-n="2">B</span>'s request, <code class="ds-v"><span class="ds-stamp" data-stamp="1,B">(</span><span class="ds-stamp ds-time" data-stamp="1,B">1</span><span class="ds-stamp" data-stamp="1,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="1,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="1,B">)</span></code>, heads its queue, and <span class="ds-actor" data-actor="C" data-actor-n="3">C</span> has answered past it. But <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> must hear from <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> past it too, and <span class="ds-actor" data-actor="A" data-actor-n="1">A</span> crashed before the request reached it: <span class="ds-actor" data-actor="B" data-actor-n="2">B</span> never enters</span></p>
