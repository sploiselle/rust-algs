<p class="ds-beat" data-in="0" data-out="1" data-event="milk"><span class="ds-beat-body"><span class="ds-lead">write milk</span> on A: <span class="ds-field">L </span><code class="ds-v"><span class="ds-lamport">1</span></code>; <span class="ds-field">x </span><code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span><span class="ds-sym">→</span><span class="ds-str">"milk"</span></code></span></p>
<p class="ds-beat" data-in="1" data-out="2" data-cont="" data-event="b-1"><span class="ds-beat-body"><span class="ds-lead">local</span> on B does something that isn't a write to x: its clock ticks, and nothing else changes</span></p>
<p class="ds-beat" data-in="2" data-out="3" data-cont="" data-event="b-2"><span class="ds-beat-body"><span class="ds-lead">local</span> on B does something else: its clock reaches <code class="ds-v">2</code>, where syncing from A took it in the history where B saw milk</span></p>
<p class="ds-beat" data-in="3" data-out="4" data-cont="" data-event="eggs"><span class="ds-beat-body"><span class="ds-lead">write eggs</span> on B writes "eggs", stamped <code class="ds-v"><span class="ds-stamp" data-stamp="3,B">(</span><span class="ds-stamp ds-time" data-stamp="3,B">3</span><span class="ds-stamp" data-stamp="3,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="3,B">)</span></code>: the same stamp as when it had seen milk, though it never heard from A</span></p>
<p class="ds-beat" data-in="4" data-out="5" data-cont="" data-note="1"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-beat-body">milk is concurrent with eggs: B never heard from A. Yet the stamps are the same as when B saw milk, <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> and <code class="ds-v"><span class="ds-stamp" data-stamp="3,B">(</span><span class="ds-stamp ds-time" data-stamp="3,B">3</span><span class="ds-stamp" data-stamp="3,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="3,B">)</span></code>, so nothing in them can tell</span></p>
<p class="ds-beat" data-in="5" data-out="6" data-cont="" data-event="a-syncs"><span class="ds-beat-body"><span class="ds-lead">sync</span> on A syncs from B: <code class="ds-v"><span class="ds-stamp" data-stamp="3,B">(</span><span class="ds-stamp ds-time" data-stamp="3,B">3</span><span class="ds-stamp" data-stamp="3,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="3,B">)</span></code> beats <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code>, so "eggs" replaces "milk", which B never saw, and nothing records that "milk" was written</span></p>
<p class="ds-beat" data-in="6" data-cont="" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-beat-body">A drops "milk" for "eggs" and ends exactly as when B saw milk: no one chose to discard "milk", and nothing on either replica records it was written</span></p>

<p class="ds-fig-title">Last writer wins on Lamport stamps: B never saw milk, which is lost</p>
<ol class="ds-notes">
<li class="ds-note" data-in="4" data-note="1" data-relation="concurrent"><span class="ds-note-n" aria-hidden="true">1</span> <span class="ds-note-body">milk is concurrent with eggs: B never heard from A. Yet the stamps are the same as when B saw milk, <code class="ds-v"><span class="ds-stamp" data-stamp="1,A">(</span><span class="ds-stamp ds-time" data-stamp="1,A">1</span><span class="ds-stamp" data-stamp="1,A">,</span><span class="ds-stamp ds-actor" data-actor="A" data-stamp="1,A" data-actor-n="1">A</span><span class="ds-stamp" data-stamp="1,A">)</span></code> and <code class="ds-v"><span class="ds-stamp" data-stamp="3,B">(</span><span class="ds-stamp ds-time" data-stamp="3,B">3</span><span class="ds-stamp" data-stamp="3,B">,</span><span class="ds-stamp ds-actor" data-actor="B" data-stamp="3,B" data-actor-n="2">B</span><span class="ds-stamp" data-stamp="3,B">)</span></code>, so nothing in them can tell</span></li>
<li class="ds-note" data-in="6" data-note="2"><span class="ds-note-n" aria-hidden="true">2</span> <span class="ds-note-body">A drops "milk" for "eggs" and ends exactly as when B saw milk: no one chose to discard "milk", and nothing on either replica records it was written</span></li>
</ol>
