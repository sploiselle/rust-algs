<svg xmlns="http://www.w3.org/2000/svg" class="ds-figure" data-figure="lamport-clock-trace" data-kind="space-time" role="img" viewBox="0 0 596 320" width="596" height="320" style="--ds-w: 596" fill="currentColor" font-family="system-ui, sans-serif">
  <title>Lamport clocks: three processes, two messages</title>
  <desc>Timelines for A, B, C. A1 on A: L 1. A2 on A: L 2. B1 on B: L 1. B2 on B, receiving m1 2 from A2 on A: L 3. C1 on C: L 1. B3 on B: L 4. C2 on C, receiving m2 4 from B3 on B: L 5. A3 on A: L 3. Note 1: A1 happened before C2, carried by m1 then m2, and its time is smaller: 1 &lt; 5. Note 2: A3 is concurrent with B3, yet its time is smaller, 3 &lt; 4, though A3 is later in real time: the clock orders events neither could have influenced.</desc>
  <style>
    @layer ds-figure {
      .ds-figure { max-width: 100%; height: auto; font-family: var(--ds-font-sans, system-ui, -apple-system, "Segoe UI", sans-serif); }
      .ds-figure:root { color-scheme: light dark; color: CanvasText; }
      .ds-figure text { fill: var(--ds-ink, currentColor); }
      .ds-figure :is(.ds-event-value, .ds-row-value, .ds-v) { font-family: var(--ds-font-mono, ui-monospace, "SF Mono", Menlo, Consolas, monospace); }
      .ds-figure .ds-sym { font-family: var(--ds-font-sym, system-ui, sans-serif); }
      .ds-figure .ds-lane-line { stroke: var(--ds-lane-line, var(--ds-rule, var(--ds-ink, currentColor))); stroke-opacity: var(--ds-lane-opacity, .5); stroke-width: var(--ds-lane-width, 1); }
      .ds-figure .ds-lane-head { fill: var(--ds-lane-line, var(--ds-rule, var(--ds-ink, currentColor))); fill-opacity: var(--ds-lane-opacity, .5); }
      .ds-figure [data-actor-n="1"] { --ds-actor: var(--ds-actor-1); }
      .ds-figure [data-actor-n="2"] { --ds-actor: var(--ds-actor-2); }
      .ds-figure [data-actor-n="3"] { --ds-actor: var(--ds-actor-3); }
      .ds-figure [data-actor-n="4"] { --ds-actor: var(--ds-actor-4); }
      .ds-figure [data-actor-n="5"] { --ds-actor: var(--ds-actor-5); }
      .ds-figure [data-actor-n="6"] { --ds-actor: var(--ds-actor-6); }
      .ds-figure [data-actor-n="7"] { --ds-actor: var(--ds-actor-7); }
      .ds-figure [data-actor-n="8"] { --ds-actor: var(--ds-actor-8); }
      .ds-figure .ds-actor { fill: var(--ds-actor); }
      .ds-figure .ds-lane-name { fill: var(--ds-lane-name, var(--ds-actor, var(--ds-ink, currentColor))); font-weight: 600; }
      .ds-figure .ds-row-name { fill: var(--ds-lane-name, var(--ds-ink, currentColor)); font-weight: 600; }
      .ds-figure .ds-event-dot { fill: var(--ds-event-dot, var(--ds-ink, currentColor)); }
      .ds-figure .ds-event-crash { stroke: var(--ds-crash, var(--ds-event-dot, var(--ds-ink, currentColor))); stroke-width: 2; }
      .ds-figure .ds-event-name { fill: var(--ds-event-name, var(--ds-muted, var(--ds-ink, currentColor))); }
      .ds-figure .ds-field { fill: var(--ds-field, var(--ds-muted, var(--ds-ink, currentColor))); }
      .ds-figure :is(.ds-event-value, .ds-row-value) { fill: var(--ds-value, var(--ds-ink, currentColor)); }
      .ds-figure .ds-message-line { fill: none; stroke: var(--ds-message-line, var(--ds-ink, currentColor)); stroke-width: var(--ds-message-width, 1.5); }
      .ds-figure .ds-message-head { fill: var(--ds-message-line, var(--ds-ink, currentColor)); }
      .ds-figure .ds-message-label { fill: var(--ds-message-label, var(--ds-muted, var(--ds-ink, currentColor))); }
      .ds-figure .ds-ring { fill: none; stroke: var(--ds-accent, var(--ds-ink, currentColor)); stroke-width: var(--ds-ring-width, 1.5); stroke-dasharray: var(--ds-ring-dash, none); }
      .ds-figure .ds-badge-disc { fill: var(--ds-accent, var(--ds-ink, currentColor)); }
      .ds-figure .ds-badge-n { fill: var(--ds-on-accent, Canvas); font-weight: 700; }
      .ds-figure .ds-caption { fill: var(--ds-caption, var(--ds-ink, currentColor)); }
      .ds-figure :is(.ds-counter, .ds-legend) { fill: var(--ds-muted, var(--ds-ink, currentColor)); }
      .ds-figure :is(.ds-dot, .ds-claim) { fill: var(--ds-dot, var(--ds-ink, currentColor)); }
      .ds-figure .ds-dot.ds-gap { fill: none; stroke: var(--ds-gap, var(--ds-ink, currentColor)); stroke-width: 1.5; stroke-dasharray: 3 2; }
      .ds-figure .ds-wrong { fill: var(--ds-wrong, var(--ds-accent, var(--ds-ink, currentColor))); font-weight: 700; }
    }
  </style>
  <g class="ds-lanes">
    <g class="ds-lane" data-lane="a" data-actor="A" data-actor-n="1">
      <line class="ds-lane-line" x1="28" y1="33" x2="588" y2="33" stroke="currentColor" stroke-opacity=".5"/>
      <polygon class="ds-lane-head" points="588,29 596,33 588,37" fill-opacity=".5"/>
      <text class="ds-lane-name" x="18" y="38" text-anchor="end" font-size="14">A</text>
    </g>
    <g class="ds-lane" data-lane="b" data-actor="B" data-actor-n="2">
      <line class="ds-lane-line" x1="28" y1="99" x2="588" y2="99" stroke="currentColor" stroke-opacity=".5"/>
      <polygon class="ds-lane-head" points="588,95 596,99 588,103" fill-opacity=".5"/>
      <text class="ds-lane-name" x="18" y="104" text-anchor="end" font-size="14">B</text>
    </g>
    <g class="ds-lane" data-lane="c" data-actor="C" data-actor-n="3">
      <line class="ds-lane-line" x1="28" y1="165" x2="588" y2="165" stroke="currentColor" stroke-opacity=".5"/>
      <polygon class="ds-lane-head" points="588,161 596,165 588,169" fill-opacity=".5"/>
      <text class="ds-lane-name" x="18" y="170" text-anchor="end" font-size="14">C</text>
    </g>
  </g>
  <g class="ds-messages">
    <g class="ds-message" data-message="m1" data-from="a2" data-to="b2" data-notes="1">
      <line class="ds-message-line" x1="131.9" y1="35.9" x2="254" y2="91.9" stroke="currentColor" stroke-width="1.5"/>
      <polygon class="ds-message-head" points="262.2,95.7 252.6,95.1 255.5,88.7"/>
      <text class="ds-message-label" x="201.7" y="56.9" text-anchor="start" font-size="12">m1 <tspan class="ds-v" font-family="ui-monospace, Menlo, Consolas, monospace">2</tspan></text>
    </g>
    <g class="ds-message" data-message="m2" data-from="b3" data-to="c2" data-notes="1">
      <line class="ds-message-line" x1="421.6" y1="106.4" x2="470" y2="150.8" stroke="currentColor" stroke-width="1.5"/>
      <polygon class="ds-message-head" points="476.7,156.9 467.7,153.4 472.4,148.2"/>
      <text class="ds-message-label" x="456.3" y="124.6" text-anchor="start" font-size="12">m2 <tspan class="ds-v" font-family="ui-monospace, Menlo, Consolas, monospace">4</tspan></text>
    </g>
  </g>
  <g class="ds-events">
    <g class="ds-event" data-event="a1" data-lane="a" data-actor="A" data-actor-n="1" data-notes="1">
      <circle class="ds-event-dot" cx="53.5" cy="33" r="5"/>
      <text class="ds-event-name" x="53.5" y="17.8" text-anchor="middle" font-size="13">A1</text>
      <text class="ds-event-value" x="53.5" y="54.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">1</tspan></text>
    </g>
    <g class="ds-event" data-event="a2" data-lane="a" data-actor="A" data-actor-n="1" data-notes="1">
      <circle class="ds-event-dot" cx="125.5" cy="33" r="5"/>
      <text class="ds-event-name" x="125.5" y="17.8" text-anchor="middle" font-size="13">A2</text>
      <text class="ds-event-value" x="129.5" y="54.8" text-anchor="end" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">2</tspan></text>
    </g>
    <g class="ds-event" data-event="b1" data-lane="b" data-actor="B" data-actor-n="2">
      <circle class="ds-event-dot" cx="197.5" cy="99" r="5"/>
      <text class="ds-event-name" x="197.5" y="83.8" text-anchor="middle" font-size="13">B1</text>
      <text class="ds-event-value" x="197.5" y="120.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">1</tspan></text>
    </g>
    <g class="ds-event" data-event="b2" data-lane="b" data-actor="B" data-actor-n="2" data-notes="1">
      <circle class="ds-event-dot" cx="269.5" cy="99" r="5"/>
      <text class="ds-event-name" x="265.5" y="83.8" text-anchor="start" font-size="13">B2</text>
      <text class="ds-event-value" x="269.5" y="120.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">3</tspan></text>
    </g>
    <g class="ds-event" data-event="c1" data-lane="c" data-actor="C" data-actor-n="3">
      <circle class="ds-event-dot" cx="341.5" cy="165" r="5"/>
      <text class="ds-event-name" x="341.5" y="149.8" text-anchor="middle" font-size="13">C1</text>
      <text class="ds-event-value" x="341.5" y="186.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">1</tspan></text>
    </g>
    <g class="ds-event" data-event="b3" data-lane="b" data-actor="B" data-actor-n="2" data-notes="1 2">
      <circle class="ds-event-dot" cx="413.5" cy="99" r="5"/>
      <text class="ds-event-name" x="413.5" y="83.8" text-anchor="middle" font-size="13">B3</text>
      <text class="ds-event-value" x="417.5" y="120.8" text-anchor="end" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">4</tspan></text>
    </g>
    <g class="ds-event" data-event="c2" data-lane="c" data-actor="C" data-actor-n="3" data-notes="1">
      <circle class="ds-event-dot" cx="485.5" cy="165" r="5"/>
      <text class="ds-event-name" x="481.5" y="149.8" text-anchor="start" font-size="13">C2</text>
      <text class="ds-event-value" x="485.5" y="186.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">5</tspan></text>
    </g>
    <g class="ds-event" data-event="a3" data-lane="a" data-actor="A" data-actor-n="1" data-notes="2">
      <circle class="ds-event-dot" cx="557.5" cy="33" r="5"/>
      <text class="ds-event-name" x="557.5" y="17.8" text-anchor="middle" font-size="13">A3</text>
      <text class="ds-event-value" x="557.5" y="54.8" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace"><tspan class="ds-field">L </tspan><tspan class="ds-lamport">3</tspan></text>
    </g>
  </g>
  <g class="ds-marks">
    <circle class="ds-ring" data-event="a1" data-notes="1" cx="53.5" cy="33" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle class="ds-ring" data-event="b3" data-notes="2" cx="413.5" cy="99" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle class="ds-ring" data-event="c2" data-notes="1" cx="485.5" cy="165" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle class="ds-ring" data-event="a3" data-notes="2" cx="557.5" cy="33" r="9" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <g class="ds-badge" data-note="1" data-event="a1" data-relation="before">
      <circle class="ds-badge-disc" cx="72.5" cy="14.5" r="7.5"/>
      <text class="ds-badge-n" x="72.5" y="18.5" text-anchor="middle" font-size="11" fill="Canvas">1</text>
    </g>
    <g class="ds-badge" data-note="2" data-event="b3" data-relation="concurrent">
      <circle class="ds-badge-disc" cx="432.5" cy="80.5" r="7.5"/>
      <text class="ds-badge-n" x="432.5" y="84.5" text-anchor="middle" font-size="11" fill="Canvas">2</text>
    </g>
    <g class="ds-badge" data-note="1" data-event="c2" data-relation="before">
      <circle class="ds-badge-disc" cx="508" cy="146.5" r="7.5"/>
      <text class="ds-badge-n" x="508" y="150.5" text-anchor="middle" font-size="11" fill="Canvas">1</text>
    </g>
    <g class="ds-badge" data-note="2" data-event="a3" data-relation="concurrent">
      <circle class="ds-badge-disc" cx="576.5" cy="14.5" r="7.5"/>
      <text class="ds-badge-n" x="576.5" y="18.5" text-anchor="middle" font-size="11" fill="Canvas">2</text>
    </g>
  </g>
  <g class="ds-captions">
    <text class="ds-caption" data-note="1" x="28" y="222" text-anchor="start" font-size="14">1. A1 happened before C2, carried by m1 then m2, and its time is</text>
    <text class="ds-caption" data-note="1" x="44" y="242" text-anchor="start" font-size="14">smaller: 1 &lt; 5</text>
    <text class="ds-caption" data-note="2" x="28" y="262" text-anchor="start" font-size="14">2. A3 is concurrent with B3, yet its time is smaller, 3 &lt; 4, though A3</text>
    <text class="ds-caption" data-note="2" x="44" y="282" text-anchor="start" font-size="14">is later in real time: the clock orders events neither could have</text>
    <text class="ds-caption" data-note="2" x="44" y="302" text-anchor="start" font-size="14">influenced</text>
  </g>
</svg>
